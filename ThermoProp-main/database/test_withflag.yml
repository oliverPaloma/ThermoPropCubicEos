O principal ponto é que o seu código original provavelmente já possui:

leitura da composição global z

propriedades termodinâmicas (Tc, Pc, omega, MM)

flash PT

cálculo EOS

Mas ele não possui a separação entre componentes leves e pesados, que no código anexado é feita com:

flag = 0  // componente conhecido/light
flag = 1  // fração pesada/SCN
Então, para implementar o lumping no outro projeto, você precisa criar uma forma alternativa de identificar:

quais componentes permanecem individuais

quais componentes serão agrupados em pseudocomponentes

O que o lumping realmente precisa
Os métodos:

lumpPedersen

lumpDanesh

lumpWhitson

não precisam necessariamente da flag.

Eles precisam apenas de:

Vec<Component> heavies;
ou seja:

lista das frações pesadas

com:

z

MM

Tb

SG

eventualmente Tc Pc omega

O que você precisa adaptar
Você basicamente precisa implementar 5 etapas.

ETAPA 1 — Identificar os componentes pesados
No código novo você provavelmente já tem algo assim:

components = {N2, CO2, C1, C2, C3, ..., C20+}
Você precisa decidir:

quais componentes são "light"
e

quais entram no lumping
Normalmente:

componente	tratamento
N2 até C6	mantém individual
C7+	entra no lumping
Exemplo
Você pode fazer:

Vec<Component> lights;
Vec<Component> heavies;

for (const auto &c : all_comps) {

    if (c.MM < 90.0) {
        lights.push_back(c);
    }
    else {
        heavies.push_back(c);
    }
}
ou:

if (carbon_number <= 6)
ou:

if (name == "C7+" ...)
depende de como seu código organiza os componentes.

ETAPA 2 — Garantir propriedades das frações pesadas
O lumping precisa de:

z

MM

Tb

SG

Então você precisa garantir que os pesados tenham isso preenchido.

Se você já possui Tc Pc omega
Ótimo.

Mas Pedersen e Whitson fazem médias usando:

boiling point

specific gravity

Então você precisa obter:

Tb
SG
para cada SCN pesada.

ETAPA 3 — Caracterizar os pesados antes do lumping
Essa foi exatamente a parte adicionada no código anexado:

for (auto &h : heavies) {

    characterizeComponent(h, opts);

}
Isso é ESSENCIAL.

Porque o lumping usa propriedades médias.

Sem isso o lumping quebra
Por exemplo:

pseudo.Tb = Σ zi*Tb_i
pseudo.SG = Σ zi*SG_i
Então:

se Tb_i = 0

ou SG_i = 0

o pseudocomponente fica inválido.

ETAPA 4 — Chamar o método de lumping
Depois de montar:

Vec<Component> heavies;
você chama:

Vec<LumpedPseudo> pseudos;

lumpPedersen(heavies, npseudos, pseudos);
ou:

lumpDanesh(...)
ou:

lumpWhitson(...)
ETAPA 5 — Reconstruir a mistura final
Depois do lumping você precisa criar:

Mixture final_mix;
contendo:

componentes leves
pseudocomponentes
Estrutura típica
for (auto &c : lights)
    final_mix.comps.push_back(c);

for (auto &p : pseudos) {

    Component pc;

    pc.z  = p.z;
    pc.MM = p.MM;
    pc.Tb = p.Tb;
    pc.SG = p.SG;

    characterizeComponent(pc, opts);

    final_mix.comps.push_back(pc);
}
O mais importante: o que NÃO precisa copiar
Você NÃO precisa copiar:

bubble pressure

dew pressure

flash

relatório

logs

summaries

Nada disso.

Para implementar lumping no outro código você precisa apenas:

MÍNIMO necessário
1. Estrutura Component
com:

name
z
MM
Tb
SG
Tc
Pc
omega
2. Separação:
lights
heavies
3. Characterization
characterizeComponent()
4. Método de lumping
lumpPedersen()
5. Recriar mistura reduzida
Fluxo simplificado
O fluxo real fica:

Leitura da mistura original
        ↓
Separar leves e pesados
        ↓
Caracterizar pesados
        ↓
Aplicar lumping
        ↓
Criar pseudocomponentes
        ↓
Caracterizar pseudocomponentes
        ↓
Montar mistura reduzida
        ↓
Enviar para flash PT
O maior problema que normalmente aparece
No seu caso provavelmente será:

seu código original não possui:
Tb
SG
nas frações pesadas.

Sem isso:

Pedersen

Whitson

Danesh

não funcionam corretamente.

Então provavelmente você vai precisar:
OU:
carregar Tb e SG do banco

OU:
usar as correlações:

characterizeComponent()
para gerar isso automaticamente.

Minha recomendação prática
A forma mais limpa é:

Antes do flash:
1. Ler mistura
2. Identificar C7+
3. Characterize C7+
4. Lumping
5. Criar nova mistura
6. Rodar flash normal
Ou seja:

o lumping deve acontecer ANTES de qualquer cálculo EOS.

Estrutura mínima que você deve implementar
Algo assim:

Vec<Component> lights;
Vec<Component> heavies;
Vec<LumpedPseudo> pseudos;
Mixture reduced_mix;
e então:

separateComponents(all_comps, lights, heavies);

characterizeHeavies(heavies);

lumpPedersen(heavies, npseudo, pseudos);

buildReducedMixture(lights, pseudos, reduced_mix);
A flag no fundo era só isso
A flag não é especial.

Ela só servia para dizer:

0 → mantém individual
1 → entra no lumping
Você pode substituir isso por:

número de carbono

MM

nome

índice

qualquer critério equivalente.


