componente	tratamento
gases permanentes	light
C1–C6	light
água	light
aromáticos leves	light
C7+	heavy/lumped
Sugestão melhor para o seu projeto
Em vez de salvar a flag manualmente, crie uma função:

int componentFlag(const String& name)
Exemplo:

int componentFlag(const String& name)
{
    static const std::set<String> lights = {
        "N2","CO2","H2O","O2",
        "C1","C2","C3",
        "IC4","NC4",
        "IC5","NC5",
        "C6","NC6",
        "McycloC5",
        "CycloC6",
        "McycloC6",
        "Benzene"
    };

    return lights.count(name) ? 0 : 1;
}
Assim você não precisa alterar seus arquivos de entrada.


