abordagem mais rigorosa	manter individuais
Para o seu caso
Como você quer implementar lumping de forma genérica e compatível com o código anexado:

a recomendação mais simples e robusta é:

Tudo acima de C6 → flag = 1
incluindo aromáticos pesados.

